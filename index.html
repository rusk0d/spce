<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>SPCE</title>
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="stat"><span class="label">Hull</span><span class="value" id="hud-hull">100</span></div>
    <div class="stat"><span class="label">Fuel</span><span class="value" id="hud-fuel">10</span></div>
    <div class="stat"><span class="label">Scrap</span><span class="value" id="hud-scrap">0</span></div>
    <div class="stat system"><span class="label">System</span><span class="value" id="hud-system"></span></div>
  </div>

  <div id="map-labels"></div>
  <div id="controls">
    <p id="help"></p>
    <button id="map-btn" type="button"><span id="map-btn-text">Galaxy Map</span><kbd>M</kbd></button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="combat" aria-live="polite">
    <div class="enemy-row">
      <span class="label">Pirate Raider</span>
      <span class="enemy-hp-text" id="enemy-hp-text"></span>
    </div>
    <div class="hp-bar"><div class="hp-fill" id="enemy-hp-fill"></div></div>
    <div class="combat-log" id="combat-log"></div>
    <button id="attack-btn" type="button">Attack</button>
  </div>

  <div id="gameover" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
    <div class="gameover-card">
      <h1 id="gameover-title">Game Over</h1>
      <p>Your ship was destroyed by pirates.</p>
      <p class="gameover-stats" id="gameover-stats"></p>
      <button id="restart-btn" type="button">Restart</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
